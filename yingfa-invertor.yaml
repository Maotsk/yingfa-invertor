substitutions:
  name: yingfa-invertor
  device_description: "Yingfa 6.2kW PI30 inverter RS232"

  # IP-адрес ESP в локальной сети.
  # Замени на свой — иначе OTA и API не будут работать.
  # Узнать можно в роутере (DHCP leases) или в ESPHome Dashboard.
  device_ip: "192.***.***.***"


# =========================================================
# ESPHOME
# =========================================================

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0

  compile_process_limit: 1

  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(startup_slow_poll_done) = false;
          ESP_LOGI("INVERTER", "STARTUP: waiting 30s before initial slow poll");
      - delay: 30s
      - script.execute: slow_poll
      - wait_until:
          condition:
            lambda: |-
              return id(startup_slow_poll_done);
          timeout: 60s
      - if:
          condition:
            lambda: |-
              return !id(startup_slow_poll_done);
          then:
            - lambda: |-
                ESP_LOGW("INVERTER", "STARTUP: slow poll timeout, enabling fast poll");
                id(startup_slow_poll_done) = true;

# =========================================================
# ESP8266
# =========================================================

esp8266:
  board: nodemcu


# =========================================================
# LOGGER
# =========================================================

logger:
  level: DEBUG
  baud_rate: 0


# =========================================================
# API
# =========================================================

api:
  encryption:
    key: !secret yingfa_api_key

# =========================================================
# OTA
# =========================================================

ota:
  - platform: esphome


# =========================================================
# WIFI
# =========================================================

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      hidden: true

  ap:
    ssid: "PVinvertor Fallback Hotspot"
    password: !secret yingfa_ap_password

  use_address: ${device_ip}


captive_portal:


# =========================================================
# TIME
# =========================================================

time:
  - platform: sntp
    id: inverter_time
    timezone: Europe/Moscow
    servers:
      - 88.147.254.230
      - 85.21.78.8
      - 194.190.168.1


# =========================================================
# UART
# =========================================================

uart:
  id: inverter_uart
  baud_rate: 2400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  tx_pin: GPIO15
  rx_pin: GPIO13


# =========================================================
# GLOBALS
# =========================================================

globals:

  - id: uart_busy
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pi30_running
    type: bool
    restore_value: no
    initial_value: "false"

  - id: slow_poll_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: last_fast_poll_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_slow_poll_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: pi30_last_ok
    type: bool
    restore_value: no
    initial_value: "false"

  - id: startup_slow_poll_done
    type: bool
    restore_value: no
    initial_value: "false"

  # Текстовые переменные для селектов
  - id: output_source_priority_text
    type: std::string
    restore_value: no
    initial_value: '"Utility First"'

  - id: input_voltage_range_text
    type: std::string
    restore_value: no
    initial_value: '"UPS"'

  - id: max_charging_current_text
    type: std::string
    restore_value: no
    initial_value: '"60 A"'

  - id: charger_source_priority_text
    type: std::string
    restore_value: no
    initial_value: '"Solar + Utility"'

  # Текущий режим инвертора (из QMOD)
  - id: inverter_mode_text
    type: std::string
    restore_value: no
    initial_value: '"Unknown"'

  # Текущий режим батареи (из QPIRI)
  - id: battery_type_text
    type: std::string
    restore_value: no
    initial_value: '"Unknown"'

  # Статус ошибок (из QPIWS)
  - id: inverter_fault_text
    type: std::string
    restore_value: no
    initial_value: '"OK"'

  # Версия прошивки (из QVFW)
  - id: firmware_version_text
    type: std::string
    restore_value: no
    initial_value: '"Unknown"'


# =========================================================
# НАСТРОЙКИ ИНТЕРВАЛОВ
# =========================================================

number:

  - platform: template
    id: fast_poll_interval_sec
    name: "Fast Poll Interval"
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    entity_category: "diagnostic"
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 3
    set_action:
      - lambda: |-
          ESP_LOGI("INVERTER", "Fast poll interval changed: %.0f s", x);

  - platform: template
    id: slow_poll_interval_min
    name: "Slow Poll Interval"
    icon: "mdi:timer-sync-outline"
    unit_of_measurement: "min"
    entity_category: "diagnostic"
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 20
    set_action:
      - lambda: |-
          ESP_LOGI("INVERTER", "Slow poll interval changed: %.0f min", x);


# =========================================================
# УПРАВЛЕНИЕ НАПРЯЖЕНИЕМ БАТАРЕИ
# =========================================================

  # PBCV — Напряжение перезаряда (Re-charge)
  - platform: template
    name: "Battery Re-charge Voltage"
    id: battery_recharge_voltage
    mode: box
    icon: "mdi:battery-charging-60"
    unit_of_measurement: "V"
    device_class: voltage
    optimistic: true
    restore_value: true
    min_value: 44.0
    max_value: 51.0
    step: 0.1
    initial_value: 46.0
    set_action:
      - lambda: |-
          char cmd[16];
          snprintf(cmd, sizeof(cmd), "PBCV%.1f", x);
          id(pi30_exchange).execute(std::string(cmd));
      - script.wait:
          id: pi30_exchange
      - delay: 300ms
      - script.execute:
          id: pi30_exchange
          command: "QPIRI"
      - script.wait:
          id: pi30_exchange

  # PBDV — Напряжение повторного разряда (Re-discharge)
  - platform: template
    name: "Battery Re-discharge Voltage"
    id: battery_redischarge_voltage
    mode: box
    icon: "mdi:battery-arrow-down"
    unit_of_measurement: "V"
    device_class: voltage
    optimistic: true
    restore_value: true
    min_value: 48.0
    max_value: 58.0
    step: 0.1
    initial_value: 54.0
    set_action:
      - lambda: |-
          char cmd[16];
          snprintf(cmd, sizeof(cmd), "PBDV%.1f", x);
          id(pi30_exchange).execute(std::string(cmd));
      - script.wait:
          id: pi30_exchange
      - delay: 300ms
      - script.execute:
          id: pi30_exchange
          command: "QPIRI"
      - script.wait:
          id: pi30_exchange

  # PCVV — Напряжение C.V. (Constant Voltage) заряда
  - platform: template
    name: "Battery C.V. Voltage"
    id: battery_cv_voltage
    mode: box
    icon: "mdi:battery-charging-80"
    unit_of_measurement: "V"
    device_class: voltage
    optimistic: true
    restore_value: true
    min_value: 48.0
    max_value: 58.4
    step: 0.1
    initial_value: 56.4
    set_action:
      - lambda: |-
          char cmd[16];
          snprintf(cmd, sizeof(cmd), "PCVV%.1f", x);
          id(pi30_exchange).execute(std::string(cmd));
      - script.wait:
          id: pi30_exchange
      - delay: 300ms
      - script.execute:
          id: pi30_exchange
          command: "QPIRI"
      - script.wait:
          id: pi30_exchange

  # PSDV — Напряжение отключения (Cut-off)
  - platform: template
    name: "Battery Cut-off Voltage"
    id: battery_cutoff_voltage
    mode: box
    icon: "mdi:battery-off-outline"
    unit_of_measurement: "V"
    device_class: voltage
    optimistic: true
    restore_value: true
    min_value: 40.0
    max_value: 48.0
    step: 0.1
    initial_value: 42.0
    set_action:
      - lambda: |-
          char cmd[16];
          snprintf(cmd, sizeof(cmd), "PSDV%.1f", x);
          id(pi30_exchange).execute(std::string(cmd));
      - script.wait:
          id: pi30_exchange
      - delay: 300ms
      - script.execute:
          id: pi30_exchange
          command: "QPIRI"
      - script.wait:
          id: pi30_exchange


# =========================================================
# BUTTONS
# =========================================================

button:

  - platform: template
    name: "Request Slow Poll"
    icon: "mdi:database-refresh"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(slow_poll_active) ||
                     id(uart_busy) ||
                     id(pi30_running);
          then:
            - lambda: |-
                ESP_LOGW("INVERTER", "Request Slow Poll ignored: PI30 is busy");
          else:
            - script.execute: slow_poll

  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"
    entity_category: diagnostic

# =========================================================
# SELECT (селекторы настроек)
# =========================================================

select:

  # Output Source Priority (Программа 01)
  - platform: template
    name: "Output Source Priority"
    id: output_source_priority_select
    icon: "mdi:source-branch"
    options:
      - "Utility First"
      - "Solar First"
      - "SBU Priority"
    lambda: |-
      return {id(output_source_priority_text)};
    set_action:
      - if:
          condition:
            lambda: |-
              return id(slow_poll_active);
          then:
            - lambda: |-
                ESP_LOGW("INVERTER", "Output Source Priority: slow poll active, ignoring");
                id(output_source_priority_select).publish_state(id(output_source_priority_text));
          else:
            - wait_until:
                condition:
                  lambda: |-
                    return !id(uart_busy) && !id(pi30_running);
                timeout: 3s
            - lambda: |-
                std::string cmd;
                if (x == "Utility First") cmd = "POP00";
                else if (x == "Solar First") cmd = "POP01";
                else if (x == "SBU Priority") cmd = "POP02";
                if (!cmd.empty()) id(pi30_exchange).execute(cmd);
            - script.wait:
                id: pi30_exchange
            - delay: 300ms
            - script.execute:
                id: pi30_exchange
                command: "QPIRI"
            - script.wait:
                id: pi30_exchange

  # Input Voltage Range (Программа 03)
  - platform: template
    name: "Input Voltage Range"
    id: input_voltage_range_select
    icon: "mdi:power-plug"
    options:
      - "Appliance"
      - "UPS"
    lambda: |-
      return {id(input_voltage_range_text)};
    set_action:
      - if:
          condition:
            lambda: |-
              return id(slow_poll_active);
          then:
            - lambda: |-
                ESP_LOGW("INVERTER", "Input Voltage Range: slow poll active, ignoring");
                id(input_voltage_range_select).publish_state(id(input_voltage_range_text));
          else:
            - wait_until:
                condition:
                  lambda: |-
                    return !id(uart_busy) && !id(pi30_running);
                timeout: 3s
            - lambda: |-
                std::string cmd;
                if (x == "Appliance") cmd = "PGR00";
                else if (x == "UPS") cmd = "PGR01";
                if (!cmd.empty()) id(pi30_exchange).execute(cmd);
            - script.wait:
                id: pi30_exchange
            - delay: 300ms
            - script.execute:
                id: pi30_exchange
                command: "QPIRI"
            - script.wait:
                id: pi30_exchange

  # Max Charging Current (Программа 02)
  - platform: template
    name: "Max Charging Current"
    id: max_charging_current_select
    icon: "mdi:current-dc"
    options:
      - "10 A"
      - "20 A"
      - "30 A"
      - "40 A"
      - "50 A"
      - "60 A"
      - "70 A"
      - "80 A"
      - "90 A"
      - "100 A"
      - "110 A"
      - "120 A"
    lambda: |-
      return {id(max_charging_current_text)};
    set_action:
      - if:
          condition:
            lambda: |-
              return id(slow_poll_active);
          then:
            - lambda: |-
                ESP_LOGW("INVERTER", "Max Charging Current: slow poll active, ignoring");
                id(max_charging_current_select).publish_state(id(max_charging_current_text));
          else:
            - wait_until:
                condition:
                  lambda: |-
                    return !id(uart_busy) && !id(pi30_running);
                timeout: 3s
            - lambda: |-
                std::string cmd;
                int amps = 0;
                if (x == "10 A") amps = 10;
                else if (x == "20 A") amps = 20;
                else if (x == "30 A") amps = 30;
                else if (x == "40 A") amps = 40;
                else if (x == "50 A") amps = 50;
                else if (x == "60 A") amps = 60;
                else if (x == "70 A") amps = 70;
                else if (x == "80 A") amps = 80;
                else if (x == "90 A") amps = 90;
                else if (x == "100 A") amps = 100;
                else if (x == "110 A") amps = 110;
                else if (x == "120 A") amps = 120;
                if (amps > 0) {
                  char buf[16];
                  snprintf(buf, sizeof(buf), "MNCHGC%03d", amps);
                  cmd = std::string(buf);
                }
                if (!cmd.empty()) id(pi30_exchange).execute(cmd);
            - script.wait:
                id: pi30_exchange
            - delay: 300ms
            - script.execute:
                id: pi30_exchange
                command: "QPIRI"
            - script.wait:
                id: pi30_exchange

  # Charger Source Priority (Программа 16)
  - platform: template
    name: "Charger Source Priority"
    id: charger_source_priority_select
    icon: "mdi:battery-charging"
    options:
      - "Solar First"
      - "Solar + Utility"
      - "Only Solar"
    lambda: |-
      return {id(charger_source_priority_text)};
    set_action:
      - if:
          condition:
            lambda: |-
              return id(slow_poll_active);
          then:
            - lambda: |-
                ESP_LOGW("INVERTER", "Charger Source Priority: slow poll active, ignoring");
                id(charger_source_priority_select).publish_state(id(charger_source_priority_text));
          else:
            - wait_until:
                condition:
                  lambda: |-
                    return !id(uart_busy) && !id(pi30_running);
                timeout: 3s
            - lambda: |-
                std::string cmd;
                if (x == "Solar First") cmd = "PCP03";
                else if (x == "Solar + Utility") cmd = "PCP01";
                else if (x == "Only Solar") cmd = "PCP02";
                if (!cmd.empty()) id(pi30_exchange).execute(cmd);
            - script.wait:
                id: pi30_exchange
            - delay: 300ms
            - script.execute:
                id: pi30_exchange
                command: "QPIRI"
            - script.wait:
                id: pi30_exchange


